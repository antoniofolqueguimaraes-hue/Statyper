<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antigravity - Typing Game</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-rocket"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg>
                <h1>Antigravity</h1>
            </div>
            <nav class="tabs">
                <button class="tab-btn active" data-tab="game">Game</button>
                <button class="tab-btn" data-tab="records">Records</button>
            </nav>
        </header>

        <main>
            <!-- Game View -->
            <section id="game-view" class="view active">
                <div class="typing-container">
                    <div class="stats-bar">
                        <div class="timer" id="timer">0.0s</div>
                        <button id="restart-btn" class="icon-btn" title="Restart">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                            Restart
                        </button>
                    </div>

                    <div class="sentence-display" id="sentence-display">
                        <!-- Characters will be injected here -->
                    </div>
                    
                    <input type="text" id="typing-input" class="hidden-input" autocomplete="off" spellcheck="false" autofocus>
                </div>

                <div id="results-modal" class="results-container hidden">
                    <h2>Session Complete!</h2>
                    
                    <div class="metrics-grid">
                        <div class="metric-card">
                            <span class="metric-label">WPM</span>
                            <span class="metric-value" id="res-wpm">0</span>
                        </div>
                        <div class="metric-card">
                            <span class="metric-label">Accuracy</span>
                            <span class="metric-value" id="res-acc">0%</span>
                        </div>
                        <div class="metric-card">
                            <span class="metric-label">Time</span>
                            <span class="metric-value" id="res-time">0s</span>
                        </div>
                        <div class="metric-card">
                            <span class="metric-label">Errors</span>
                            <span class="metric-value" id="res-err">0</span>
                        </div>
                    </div>

                    <div class="chart-container">
                        <canvas id="performance-chart"></canvas>
                    </div>

                    <div class="results-actions">
                        <button id="next-btn" class="primary-btn">Next Sentence</button>
                        <button id="retry-btn" class="secondary-btn">Retry Sentence</button>
                    </div>
                </div>
            </section>

            <!-- Records View -->
            <section id="records-view" class="view hidden">
                <div class="records-header">
                    <h2>Session History</h2>
                    <button id="clear-records-btn" class="danger-btn">Clear All</button>
                </div>
                
                <div class="table-container">
                    <table id="records-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>WPM</th>
                                <th>Accuracy</th>
                                <th>Time</th>
                                <th>Errors</th>
                            </tr>
                        </thead>
                        <tbody id="records-body">
                            <!-- Records will be injected here -->
                        </tbody>
                    </table>
                </div>
                <div id="no-records" class="empty-state hidden">
                    <p>No typing records found. Play a game to see your history!</p>
                </div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
